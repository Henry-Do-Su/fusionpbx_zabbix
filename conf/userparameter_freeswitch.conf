# =============================================================================
# Zabbix UserParameter Configuration for FreeSWITCH / FusionPBX
# =============================================================================

# --- Calls ---
UserParameter=freeswitch.calls.total,/etc/zabbix/scripts/freeswitch_metric.sh calls_total
UserParameter=freeswitch.calls.inbound,/etc/zabbix/scripts/freeswitch_metric.sh calls_inbound
UserParameter=freeswitch.calls.outbound,/etc/zabbix/scripts/freeswitch_metric.sh calls_outbound

# --- Channels ---
UserParameter=freeswitch.channels.count,/etc/zabbix/scripts/freeswitch_metric.sh channels_count

# --- Sessions ---
UserParameter=freeswitch.sessions.current,/etc/zabbix/scripts/freeswitch_metric.sh sessions_current
UserParameter=freeswitch.sessions.peak,/etc/zabbix/scripts/freeswitch_metric.sh sessions_peak
UserParameter=freeswitch.sessions.max,/etc/zabbix/scripts/freeswitch_metric.sh sessions_max

# --- Sessions per second ---
UserParameter=freeswitch.sessions_per_sec.current,/etc/zabbix/scripts/freeswitch_metric.sh sessions_per_sec_current
UserParameter=freeswitch.sessions_per_sec.max,/etc/zabbix/scripts/freeswitch_metric.sh sessions_per_sec_max

# --- Registrations ---
UserParameter=freeswitch.registrations.count,/etc/zabbix/scripts/freeswitch_metric.sh registrations

# --- Health ---
UserParameter=freeswitch.uptime.seconds,/etc/zabbix/scripts/freeswitch_metric.sh uptime
UserParameter=freeswitch.status.ready,/etc/zabbix/scripts/freeswitch_metric.sh ready

# --- Gateway Status (approximate - see README) ---
UserParameter=freeswitch.gateways.failed,/etc/zabbix/scripts/freeswitch_metric.sh gateways_failed


# =============================================================================
# FusionPBX Event Guard / iptables
# =============================================================================

# Low-level discovery for Event Guard chains
UserParameter=fusionpbx.event_guard.discovery,/etc/zabbix/scripts/freeswitch_metric.sh event_guard_lld

# Per-chain metrics
UserParameter=fusionpbx.event_guard.chain.exists[*],/etc/zabbix/scripts/freeswitch_metric.sh event_guard_chain_exists "$1"
UserParameter=fusionpbx.event_guard.banned.total[*],/etc/zabbix/scripts/freeswitch_metric.sh event_guard_banned_total "$1"
UserParameter=fusionpbx.event_guard.banned.unique[*],/etc/zabbix/scripts/freeswitch_metric.sh event_guard_banned_unique "$1"
UserParameter=fusionpbx.event_guard.banned.duplicates[*],/etc/zabbix/scripts/freeswitch_metric.sh event_guard_banned_duplicates "$1"
UserParameter=fusionpbx.event_guard.banned.list[*],/etc/zabbix/scripts/freeswitch_metric.sh event_guard_banned_list "$1"
UserParameter=fusionpbx.event_guard.packets[*],/etc/zabbix/scripts/freeswitch_metric.sh event_guard_packets "$1"
UserParameter=fusionpbx.event_guard.bytes[*],/etc/zabbix/scripts/freeswitch_metric.sh event_guard_bytes "$1"

# Combined metrics across all configured Event Guard chains
UserParameter=fusionpbx.event_guard.banned.total.all,/etc/zabbix/scripts/freeswitch_metric.sh event_guard_banned_total_all
UserParameter=fusionpbx.event_guard.banned.unique.all,/etc/zabbix/scripts/freeswitch_metric.sh event_guard_banned_unique_all
UserParameter=fusionpbx.event_guard.banned.duplicates.all,/etc/zabbix/scripts/freeswitch_metric.sh event_guard_banned_duplicates_all
UserParameter=fusionpbx.event_guard.packets.all,/etc/zabbix/scripts/freeswitch_metric.sh event_guard_packets_all
UserParameter=fusionpbx.event_guard.bytes.all,/etc/zabbix/scripts/freeswitch_metric.sh event_guard_bytes_all
